# ThinkPHP 5 伪静态 — Nginx 片段
# 使用方式：合并到站点 server { } 内，通常放在 PHP location 之前或与宝塔「thinkphp」规则等效。
# 文档根须为项目 public 目录。

location / {
    if (!-e $request_filename) {
        rewrite ^(.*)$ /index.php?s=$1 last;
    }
}

# 可选：禁止访问敏感目录（路径按实际项目调整）
# location ~* (runtime|application|config)/ {
#     return 403;
# }
