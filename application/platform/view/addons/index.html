<script type="text/javascript" src="/assets/ueditor/third-party/webuploader/webuploader.min.js"></script>
<link rel="stylesheet" type="text/css" href="/assets/ueditor/third-party/webuploader/webuploader.css">

<style>
.pf-page-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px; gap: 12px;
}
.pf-page-title { font-size: 18px; font-weight: 700; color: #0f172a; }
.pf-upload-btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 36px; padding: 0 18px; border-radius: 10px;
    background: #2563eb; color: #fff; font-size: 13px; font-weight: 600;
    cursor: pointer; text-decoration: none; border: none;
    box-shadow: 0 6px 16px rgba(37, 99, 235, .25);
    position: relative;
}
.pf-upload-btn:hover { background: #1d4ed8; color: #fff; text-decoration: none; }
.webuploader-pick { background: none; padding: 0; border: 0; }
.webuploader-pick-hover { background: none; padding: 0; }

.pf-upload-status {
    display: inline-block; margin-left: 10px;
    line-height: 32px; font-size: 13px; color: #64748b;
}

.pf-card {
    background: #fff; border-radius: 18px; overflow: hidden;
    box-shadow: 0 4px 20px rgba(15, 23, 42, .06);
}
.pf-table { width: 100%; border-collapse: collapse; font-size: 13px; color: #374151; }
.pf-table thead th {
    background: #f8fafc; padding: 13px 16px; font-weight: 600;
    color: #64748b; border-bottom: 1px solid #f1f5f9; white-space: nowrap;
}
.pf-table tbody td {
    padding: 14px 16px; border-bottom: 1px solid #f8fafc; vertical-align: middle;
}
.pf-table tbody tr:last-child td { border-bottom: none; }
.pf-table tbody tr:hover td { background: #f8fafc; }
.pf-addon-name { font-weight: 600; color: #0f172a; }
.pf-addon-code {
    font-family: 'SFMono-Regular', Menlo, Consolas, monospace;
    font-size: 12px;
    background: #f1f5f9; color: #475569;
    padding: 2px 8px; border-radius: 6px;
}
.pf-addon-version {
    font-size: 12px; color: #64748b;
    background: #f8fafc; padding: 2px 8px; border-radius: 6px;
}
.pf-status-on, .pf-status-off {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
}
.pf-status-on  { background: #f0fdf4; color: #16a34a; }
.pf-status-off { background: #fef3c7; color: #d97706; }
.pf-act {
    display: inline-flex; align-items: center; height: 28px; padding: 0 12px;
    border-radius: 7px; font-size: 12px; font-weight: 500;
    text-decoration: none; border: none; cursor: pointer;
    transition: opacity .16s;
}
.pf-act:hover { opacity: .82; text-decoration: none; }
.pf-act-install   { background: #eff6ff; color: #2563eb; }
.pf-act-uninstall { background: #fef2f2; color: #dc2626; }
.pf-empty {
    text-align: center; padding: 48px; color: #94a3b8; font-size: 14px;
}
</style>

<div class="pf-page-header">
    <div class="pf-page-title">插件管理</div>
    <div style="display:flex;align-items:center;">
        <a href="javascript:" class="pf-upload-btn" id="ImportAddons">
            <i class="layui-icon layui-icon-add-circle-fine"></i> 上传插件
        </a>
        <div id="thelist" class="pf-upload-status"></div>
    </div>
</div>

<div class="pf-card">
    <table class="pf-table">
        <thead>
            <tr>
                <th>插件标识</th>
                <th>插件名称</th>
                <th>作者</th>
                <th>版本</th>
                <th>状态</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            {if condition="empty($list)"}
            <tr><td colspan="6"><div class="pf-empty">暂无插件</div></td></tr>
            {/if}
            {volist name="list" id="vo"}
            <tr>
                <td><span class="pf-addon-code">{$vo.name}</span></td>
                <td><span class="pf-addon-name">{$vo.title}</span></td>
                <td>{$vo.author}</td>
                <td><span class="pf-addon-version">v{$vo.version}</span></td>
                <td>
                    {eq name="vo.status" value="1"}
                        <span class="pf-status-on">已安装</span>
                    {else/}
                        <span class="pf-status-off">未安装</span>
                    {/eq}
                </td>
                <td>
                    {eq name="vo.status" value="1"}
                        <a href="{:url('Addons/uninstall',['name'=>$vo.name])}" class="pf-act pf-act-uninstall">卸载</a>
                    {else/}
                        <a href="{:url('Addons/install',['name'=>$vo.name])}" class="pf-act pf-act-install">安装</a>
                    {/eq}
                </td>
            </tr>
            {/volist}
        </tbody>
    </table>
</div>

<script src="__script__/platform/clipboard.min.js?v=__lkversion__"></script>
<script src="__script__/jquery.datetimepicker.full.min.js?v=__lkversion__"></script>
<script>
    var layer;
    layui.use('layer', function () { layer = layui.layer; });
    var $list = $('#thelist');
    var state = 'pending';
    var uploader = WebUploader.create({
        swf: '/assets/ueditor/third-party/webuploader/Uploader.swf',
        server: "{:url('Addons/lxinstall')}",
        pick: { id: '#ImportAddons', multiple: false, innerHTML: '<i class="layui-icon layui-icon-add-circle-fine"></i> 上传插件' },
        chunked: true,
        chunkSize: 2 * 1024 * 1024,
        accept: { extensions: "zip", mimeTypes: ".zip" },
        duplicate: true
    });

    uploader.on('fileQueued', function (file) {
        uploader.upload();
        $list.append('<div id="' + file.id + '" class="item"><p class="state" style="margin:0;color:#64748b;">等待上传…</p></div>');
    });
    uploader.on('uploadProgress', function (file, percentage) {
        $('#' + file.id).find('p.state').text('上传中（' + parseInt(percentage * 100) + '%）');
    });
    uploader.on('uploadSuccess', function (file, response) {
        if (response.code > 0) {
            layer.msg(response.msg, function () {
                var location = window.location;
                location.href = location.pathname + location.search;
            });
        } else {
            layer.msg(response.msg, { icon: 2, time: 3000 });
        }
        $list.empty();
    });
    uploader.on('uploadError', function (file) { $('#' + file.id).find('p.state').text('上传出错'); });
    uploader.on('uploadComplete', function (file) {
        $('#' + file.id).find('.progress').fadeOut();
        uploader.reset();
    });
</script>
