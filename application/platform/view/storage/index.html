<style>
.pf-page-title { font-size: 18px; font-weight: 700; color: #0f172a; margin-bottom: 18px; }
.pf-section-card {
    background: #fff;
    border-radius: 18px;
    padding: 24px 28px;
    margin-bottom: 18px;
    box-shadow: 0 4px 20px rgba(15, 23, 42, .06);
}
.pf-section-card h3 {
    font-size: 15px;
    font-weight: 700;
    color: #0f172a;
    margin: 0 0 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid #f1f5f9;
    display: flex;
    align-items: center;
    gap: 8px;
}
.pf-section-card h3 .pf-section-icon {
    width: 24px; height: 24px; border-radius: 7px;
    background: #eff6ff; color: #2563eb;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 13px;
}
.pf-section-card .form-group.row { margin-bottom: 18px; }
.pf-section-card .col-form-label { padding-top: 8px; font-weight: 500; color: #475569; }
.pf-section-card .form-input { width: 100%; max-width: 520px; }
.pf-section-card label { font-size: 13px; color: #475569; margin-bottom: 6px; display: inline-block; }
.radio-label {
    display: inline-flex; align-items: center; gap: 6px;
    margin-right: 18px; cursor: pointer;
}
.radio-label .label-text { font-size: 13px; color: #374151; }
.pf-save-bar {
    position: sticky; bottom: 0;
    background: linear-gradient(to top, #f4f7fb 70%, rgba(244,247,251,0));
    padding: 16px 0 4px; text-align: center; z-index: 5;
}
</style>

<div class="pf-page-title">存储设置</div>

<form method="post" return="{:url('platform/storage/index')}" action="{:url('platform/storage/index')}" id="storage" class="auto-submit-form auto-form">
    <div class="pf-section-card">
        <h3><span class="pf-section-icon">📦</span>上传配置</h3>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label">限制图片大小（MB）</label>
            <div class="col-sm-6 form-input">
                <input class="form-control" name="image_size" value="{$size['image_size']}">
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label">限制文件大小（MB）</label>
            <div class="col-sm-6 form-input">
                <input class="form-control" name="file_size" value="{$size['file_size']}">
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label">上传存储方式</label>
            <div class="col-sm-6 form-input">
                <select class="form-control" name="storage_type" v-model="storage_type">
                    {if condition="in_array('Local',$permission)"}<option value="1">本地（当前服务器）</option>{/if}
                    {if condition="in_array('AliOss',$permission)"}<option value="2">阿里云 OSS</option>{/if}
                    {if condition="in_array('TxCos',$permission)"}<option value="3">腾讯云 COS</option>{/if}
                    {if condition="in_array('Qiniu',$permission)"}<option value="4">七牛云</option>{/if}
                </select>
            </div>
        </div>
    </div>

    <div class="pf-section-card" v-bind:hidden="storage_type!='2'?true:false">
        <h3><span class="pf-section-icon">☁</span>阿里云 OSS 配置</h3>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label">Bucket</label>
            <div class="col-sm-6 form-input">
                <input class="form-control" name="AliOss[bucket]" value="{$AliOss['bucket']}">
                <div class="text-muted fs-sm">请设置存储空间为公共读</div>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label">Endpoint / 域名</label>
            <div class="col-sm-6 form-input">
                <input class="form-control" name="AliOss[domain]" value="{$AliOss['domain']}">
                <div class="text-muted fs-sm">例：http://oss-cn-hangzhou.aliyuncs.com 或自定义域名 http://mydomain.com</div>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label">使用自定义域名</label>
            <div class="col-sm-6 form-input">
                <label class="radio-label">
                    <input id="radio1" value="0" {if condition="$AliOss['cname'] == 0"} checked {/if} name="AliOss[cname]" type="radio">
                    <span class="label-text">否</span>
                </label>
                <label class="radio-label">
                    <input id="radio2" value="1" {if condition="$AliOss['cname'] == 1"} checked {/if} name="AliOss[cname]" type="radio">
                    <span class="label-text">是</span>
                </label>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label">Access Key ID</label>
            <div class="col-sm-6 form-input">
                <input class="form-control" name="AliOss[access_key]" value="{$AliOss['access_key']}">
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label">Access Key Secret</label>
            <div class="col-sm-6 form-input">
                <input class="form-control" type="password" name="AliOss[secret_key]" value="{$AliOss['secret_key']}">
            </div>
        </div>
    </div>

    <div class="pf-section-card" v-bind:hidden="storage_type!='3'?true:false">
        <h3><span class="pf-section-icon">☁</span>腾讯云 COS 配置</h3>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label">Bucket</label>
            <div class="col-sm-6 form-input">
                <input class="form-control" name="TxCos[bucket]" value="{$TxCos['bucket']}">
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label">所属地域（Region）</label>
            <div class="col-sm-6 form-input">
                <input class="form-control" name="TxCos[region]" value="{$TxCos['region']}">
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label">访问域名</label>
            <div class="col-sm-6 form-input">
                <input class="form-control" name="TxCos[domain]" value="{$TxCos['domain']|default=''}">
                <div class="text-muted fs-sm">例：https://xxx.cos.ap-shanghai.myqcloud.com 或自定义域名</div>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label">SecretId</label>
            <div class="col-sm-6 form-input">
                <input class="form-control" name="TxCos[secret_id]" value="{$TxCos['secret_id']}">
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label">SecretKey</label>
            <div class="col-sm-6 form-input">
                <input class="form-control" type="password" name="TxCos[secret_key]" value="{$TxCos['secret_key']}">
            </div>
        </div>
    </div>

    <div class="pf-section-card" v-bind:hidden="storage_type!='4'?true:false">
        <h3><span class="pf-section-icon">☁</span>七牛云配置</h3>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label">Bucket</label>
            <div class="col-sm-6 form-input">
                <input class="form-control" name="Qiniu[bucket]" value="{$Qiniu['bucket']}">
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label">绑定域名</label>
            <div class="col-sm-6 form-input">
                <input class="form-control" name="Qiniu[domain]" value="{$Qiniu['domain']}">
                <div class="text-muted fs-sm">例：abstehdsdw.bkt.clouddn.com，<span style="color:#dc2626;">结尾不需要 /</span></div>
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label">AccessKey</label>
            <div class="col-sm-6 form-input">
                <input class="form-control" name="Qiniu[access_key]" value="{$Qiniu['access_key']}">
            </div>
        </div>

        <div class="form-group row">
            <label class="col-sm-3 col-form-label">SecretKey</label>
            <div class="col-sm-6 form-input">
                <input class="form-control" type="password" name="Qiniu[secret_key]" value="{$Qiniu['secret_key']}">
            </div>
        </div>
    </div>

    <div class="pf-save-bar">
        <a class="btn btn-primary submit-btn auto-form-btn" href="javascript:">保存设置</a>
    </div>
</form>

<script>
    var app = new Vue({
        el: "#storage",
        data: { storage_type: "{$type}" },
    });
</script>
