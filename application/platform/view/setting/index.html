<script>
    function nativeUpload(fileInput, url, onSuccess) {
        if (!fileInput.files || !fileInput.files[0]) return;
        var file = fileInput.files[0];
        if (file.size > 5 * 1024 * 1024) { $.myToast({ content: '文件不能超过5MB' }); fileInput.value = ''; return; }
        var fd = new FormData();
        fd.append('file', file);
        var btn = $(fileInput).closest('.btn');
        var origHtml = btn.contents().filter(function(){ return this.nodeType === 3; }).first();
        btn.css('opacity', '.6');
        $.ajax({
            url: url, type: 'POST', data: fd,
            processData: false, contentType: false, dataType: 'json',
            success: function (res) {
                btn.css('opacity', '1');
                if (res.code == 0) { onSuccess(res); }
                else { $.myToast({ content: res.msg || '上传失败' }); }
            },
            error: function () { btn.css('opacity', '1'); $.myToast({ content: '上传请求失败' }); },
            complete: function () { fileInput.value = ''; }
        });
    }

    $(document).on('change', '.logo-file-input', function () {
        nativeUpload(this, "{:url('upload/image')}", function (res) {
            $('input[name=logo]').val(res.data.url);
            if ($('.logo-preview img').length) { $('.logo-preview img').attr('src', res.data.url); }
            else { $('.logo-preview').html('<img src="' + res.data.url + '">'); }
        });
    });

    $(document).on('change', '.verify-file-input', function () {
        nativeUpload(this, "{:url('upload/file')}", function (res) {
            $('input[name=mp_verify]').val(res.data.url);
        });
    });

    $(document).on('change', '.passport-file-input', function () {
        nativeUpload(this, "{:url('upload/image')}", function (res) {
            $('input[name=passport_bg]').val(res.data.url);
            if ($('.passport-preview').length) { $('.passport-preview').attr('src', res.data.url); }
        });
    });
</script>
