{include file="public/header"/}
<style>
    #container { padding: 16px 20px 40px; overflow-y: auto; }
    .qr-toolbar { margin-bottom: 12px; }
    .qr-toolbar .layui-input-inline { margin-right: 8px; margin-bottom: 8px; }
    #qr-preview-box { text-align: center; padding: 12px 0; }
    .qr-create-form .layui-form-item { margin-bottom: 14px; }
    .qr-create-form label.layui-form-label { width: 90px; }
    .qr-create-form .layui-input-block { margin-left: 100px; }

    @media (max-width: 768px) {
        #container { padding: 10px 8px 24px; }
        .page-header { font-size: 16px !important; }
        .qr-toolbar .layui-input-inline {
            display: block;
            width: 100% !important;
            margin-right: 0;
            margin-bottom: 8px;
        }
        .qr-toolbar .layui-input-inline .layui-input,
        .qr-toolbar .layui-input-inline select {
            width: 100% !important;
        }
        .qr-create-form label.layui-form-label {
            width: auto;
            text-align: left;
            padding: 6px 0;
        }
        .qr-create-form .layui-input-block {
            margin-left: 0;
        }
        #create-channel-form { padding: 12px 10px 4px !important; }
    }
</style>
<script type="text/javascript" src="/assets/js/arale-qrcode.js"></script>
<div id="container" class="adm-content-shell">
    <h2 class="page-header" style="font-size: 18px;color: #555;">二维码渠道管理</h2>
    <div style="margin-bottom:12px;">
        <button type="button" class="layui-btn layui-btn-sm" id="btn-create-channel">+ 创建渠道</button>
    </div>

    <!-- 创建渠道弹窗内容 -->
    <div id="create-channel-form" style="display:none;padding:20px 24px 8px;">
        <form class="layui-form qr-create-form">
            <div class="layui-form-item">
                <label class="layui-form-label">备注名称 <span style="color:red">*</span></label>
                <div class="layui-input-block">
                    <input type="text" id="cr_remark" placeholder="客户名称，扫码后将作为访客显示名" class="layui-input" autocomplete="off" maxlength="100">
                    <div style="color:#999;font-size:12px;margin-top:4px;">该备注即扫码客户的名字，建议填写客户真实姓名</div>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">模板</label>
                <div class="layui-input-block">
                    <select id="cr_template">
                        <option value="0">默认模板（无特殊外观）</option>
                        {volist name="templates" id="tp"}
                        <option value="{$tp.id}">{$tp.template_name}</option>
                        {/volist}
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">一对一模式</label>
                <div class="layui-input-block" style="padding-top:8px;">
                    <input type="checkbox" id="cr_one_to_one" lay-skin="primary" title="启用（该链接只允许首次访问的客户使用，其他人扫码将被拒绝）">
                    <div style="color:#999;font-size:12px;margin-top:4px;">启用后，该链接仅限首次扫码的访客使用，实现"一客户一码"</div>
                </div>
            </div>
        </form>
    </div>

    <form class="layui-form qr-toolbar" lay-filter="qr-filter" onsubmit="return false;">
        <div class="layui-input-inline" style="width:140px;">
            <select name="service_id" id="f_service">
                <option value="">全部客服</option>
                {volist name="services" id="sv"}
                <option value="{$sv.service_id}">{if $sv.nick_name}{$sv.nick_name}{else /}{$sv.user_name}{/if}</option>
                {/volist}
            </select>
        </div>
        <div class="layui-input-inline" style="width:140px;">
            <select name="template_id" id="f_template">
                <option value="">全部模板</option>
                {volist name="templates" id="tp"}
                <option value="{$tp.id}">{$tp.template_name}</option>
                {/volist}
            </select>
        </div>
        <div class="layui-input-inline" style="width:120px;">
            <select name="status" id="f_status">
                <option value="">启用+禁用</option>
                <option value="1">仅启用</option>
                <option value="0">仅禁用</option>
            </select>
        </div>
        <div class="layui-input-inline" style="width:180px;">
            <input type="text" name="keyword" id="f_keyword" placeholder="备注关键词" class="layui-input" autocomplete="off">
        </div>
        <div class="layui-input-inline" style="width:130px;">
            <input type="text" name="start_time" id="f_start" placeholder="开始日期" class="layui-input" autocomplete="off">
        </div>
        <div class="layui-input-inline" style="width:130px;">
            <input type="text" name="end_time" id="f_end" placeholder="结束日期" class="layui-input" autocomplete="off">
        </div>
        <div class="layui-input-inline">
            <button type="button" class="layui-btn layui-btn-sm" id="btn-search">筛选</button>
            <button type="button" class="layui-btn layui-btn-primary layui-btn-sm" id="btn-reset">重置</button>
        </div>
    </form>

    <table id="qr-channel-table" lay-filter="qr-channel-table"></table>
</div>

<script type="text/html" id="qr-channel-bar">
    <a class="layui-btn layui-btn-xs layui-btn-primary" lay-event="detail">详情</a>
    <a class="layui-btn layui-btn-xs" lay-event="qrcode">二维码</a>
    <a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="copy">复制链接</a>
    <a class="layui-btn layui-btn-xs layui-btn-primary" lay-event="download">下载</a>
    <a class="layui-btn layui-btn-xs" lay-event="logs">扫码记录</a>
    {{# if(d.one_to_one == 1 && d.locked_visiter_id){ }}
    <a class="layui-btn layui-btn-xs layui-btn-warm" lay-event="unlock">解锁</a>
    {{# } }}
    {{# if(d.status == 1){ }}
    <a class="layui-btn layui-btn-xs layui-btn-warm" lay-event="off">禁用</a>
    {{# } else if(d.status == 0){ }}
    <a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="on">启用</a>
    {{# } }}
    <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</a>
</script>

<script>
layui.use(['table', 'form', 'layer', 'laydate'], function () {
    var table = layui.table;
    var form = layui.form;
    var layer = layui.layer;
    var laydate = layui.laydate;
    laydate.render({ elem: '#f_start', type: 'date' });
    laydate.render({ elem: '#f_end', type: 'date' });

    // 创建渠道
    $('#btn-create-channel').on('click', function () {
        $('#cr_remark').val('');
        $('#cr_template').val('0');
        document.getElementById('cr_one_to_one').checked = false;
        var dlgW = window.innerWidth < 500 ? (window.innerWidth - 20) + 'px' : '480px';
        layer.open({
            type: 1,
            title: '创建二维码渠道',
            area: [dlgW, 'auto'],
            content: $('#create-channel-form'),
            btn: ['生成二维码', '取消'],
            success: function () {
                form.render('select');
                form.render('checkbox');
            },
            yes: function (idx) {
                var remark = $.trim($('#cr_remark').val());
                if (!remark) {
                    layer.msg('请填写备注名称（客户名字）', { icon: 2 });
                    return false;
                }
                var templateId = $('#cr_template').val() || '0';
                var oneToOne = document.getElementById('cr_one_to_one').checked ? 1 : 0;
                $.ajax({
                    url: YMWL_ROOT_URL + '/admin/qrchannel/create',
                    type: 'post',
                    dataType: 'json',
                    data: { remark: remark, template_id: templateId, one_to_one: oneToOne },
                    success: function (res) {
                        if (res.code !== 0) {
                            layer.msg(res.msg || '创建失败', { icon: 2 });
                            return;
                        }
                        layer.close(idx);
                        reload();
                        var url = res.data.url || '';
                        var html = '<div style="padding:16px;">'
                            + '<p style="margin-bottom:10px;font-size:13px;">渠道已创建！以下链接即为该客户的专属入口：</p>'
                            + '<div id="new-qr-box" style="text-align:center;margin:12px 0;"></div>'
                            + '<p style="word-break:break-all;font-size:12px;color:#555;background:#f5f5f5;padding:8px;border-radius:4px;">' + url + '</p>'
                            + '<button class="layui-btn layui-btn-sm layui-btn-normal" onclick="(function(){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(\'' + url.replace(/'/g, "\\'") + '\').then(function(){layui.layer.msg(\'已复制\')}).catch(function(){prompt(\'复制链接\',\'' + url.replace(/'/g, "\\'") + '\')});}else{prompt(\'复制链接\',\'' + url.replace(/'/g, "\\'") + '\');}})()">复制链接</button>'
                            + '</div>';
                        var resW = window.innerWidth < 420 ? (window.innerWidth - 20) + 'px' : '400px';
                        layer.open({
                            type: 1,
                            title: '创建成功 - ' + remark,
                            area: [resW, 'auto'],
                            content: html,
                            success: function () {
                                setTimeout(function () {
                                    var box = document.getElementById('new-qr-box');
                                    if (box && url) {
                                        box.appendChild(new AraleQRCode({ render: 'canvas', correctLevel: 0, text: url, size: 200, background: '#fff', foreground: '#000' }));
                                    }
                                }, 50);
                            }
                        });
                    },
                    error: function () { layer.msg('请求失败，请稍后再试', { icon: 2 }); }
                });
            }
        });
    });

    var isMobile = window.innerWidth < 768;
    var tableCols = isMobile ? [[
            { field: 'remark', title: '备注', minWidth: 100 },
            { field: 'status', title: '状态', width: 60, templet: function (d) {
                if (d.status == 1) return '<span style="color:green">启用</span>';
                if (d.status == 0) return '<span style="color:#999">禁用</span>';
                return d.status;
            }},
            { field: 'scan_count', title: '扫码', width: 60 },
            { title: '操作', width: 200, align: 'center', toolbar: '#qr-channel-bar' }
    ]] : [[
            { field: 'channel_id', title: 'ID', width: 70 },
            { field: 'remark', title: '备注', minWidth: 120 },
            { field: 'service_nick', title: '所属客服', width: 120, templet: function (d) {
                return (d.service_nick || d.service_user || '-') + '';
            }},
            { field: 'template_name', title: '模板', width: 120 },
            { field: 'scan_count', title: '扫码次数', width: 100 },
            { field: 'one_to_one', title: '一对一', width: 80, templet: function (d) {
                if (d.one_to_one == 1) {
                    var locked = d.locked_visiter_id ? '<span style="color:green">已锁定</span>' : '<span style="color:orange">待锁定</span>';
                    return locked;
                }
                return '—';
            }},
            { field: 'last_scan_time', title: '最后扫码', width: 160 },
            { field: 'status', title: '状态', width: 90, templet: function (d) {
                if (d.status == 1) return '<span style="color:green">启用</span>';
                if (d.status == 0) return '<span style="color:#999">禁用</span>';
                return d.status;
            }},
            { field: 'created_at', title: '创建时间', width: 160 },
            { title: '操作', width: 320, align: 'center', fixed: 'right', toolbar: '#qr-channel-bar' }
    ]];

    var tableIns = table.render({
        elem: '#qr-channel-table',
        url: YMWL_ROOT_URL + '/admin/qrchannel/channelList',
        method: 'get',
        page: true,
        limit: isMobile ? 10 : 20,
        cols: tableCols,
        parseData: function (res) {
            return { code: res.code === 0 ? 0 : 1, msg: res.msg, count: res.count, data: res.data || [] };
        }
    });

    function reload() {
        tableIns.reload({
            where: {
                service_id: $('#f_service').val(),
                template_id: $('#f_template').val(),
                status: $('#f_status').val(),
                keyword: $('#f_keyword').val(),
                start_time: $('#f_start').val(),
                end_time: $('#f_end').val()
            },
            page: { curr: 1 }
        });
    }

    $('#btn-search').on('click', reload);
    $('#btn-reset').on('click', function () {
        $('#f_service').val('');
        $('#f_template').val('');
        $('#f_status').val('');
        $('#f_keyword').val('');
        $('#f_start').val('');
        $('#f_end').val('');
        form.render('select');
        reload();
    });

    function copyText(t) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(t).then(function () { layer.msg('已复制'); })
                .catch(function () { prompt('复制链接', t); });
        } else {
            prompt('复制链接', t);
        }
    }

    function renderQr(url, img) {
        $('#qr-preview-box').empty();
        var cfg = { render: 'canvas', correctLevel: 0, text: url, size: 200, background: '#fff', foreground: '#000' };
        if (img) { cfg.image = img; cfg.imageSize = 48; }
        $('#qr-preview-box').append(new AraleQRCode(cfg));
    }

    table.on('tool(qr-channel-table)', function (obj) {
        var d = obj.data;
        if (obj.event === 'copy') {
            copyText(d.qr_url || '');
            return;
        }
        if (obj.event === 'download') {
            var $box = $('<div style="position:fixed;left:-9999px;top:0;"></div>');
            $('body').append($box);
            var cfg = { render: 'canvas', correctLevel: 0, text: d.qr_url || '', size: 200, background: '#fff', foreground: '#000' };
            if (d.qr_image) { cfg.image = d.qr_image; cfg.imageSize = 48; }
            $box.append(new AraleQRCode(cfg));
            setTimeout(function () {
                var canvas = $box.find('canvas')[0];
                if (!canvas) { $box.remove(); layer.msg('二维码生成失败', { icon: 2 }); return; }
                var a = document.createElement('a');
                a.href = canvas.toDataURL('image/png');
                a.download = 'channel-' + d.channel_id + '.png';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                $box.remove();
            }, 200);
            return;
        }
        if (obj.event === 'detail') {
            $.get(YMWL_ROOT_URL + '/admin/qrchannel/channelDetail', { id: d.channel_id }, function (res) {
                if (res.code !== 0) { layer.msg(res.msg || '加载失败', { icon: 2 }); return; }
                var html = '<pre style="text-align:left;max-height:400px;overflow:auto;font-size:12px;padding:12px;">'
                    + JSON.stringify(res.data, null, 2) + '</pre>';
                var detailW = window.innerWidth < 660 ? (window.innerWidth - 20) + 'px' : '640px';
                var detailH = window.innerWidth < 660 ? (window.innerHeight - 40) + 'px' : '520px';
                layer.open({ type: 1, title: '渠道 #' + d.channel_id + ' 详情', area: [detailW, detailH], content: html });
            }, 'json');
            return;
        }
        if (obj.event === 'qrcode') {
            var qrW = window.innerWidth < 340 ? (window.innerWidth - 20) + 'px' : '320px';
            layer.open({
                type: 1,
                title: '渠道 #' + d.channel_id,
                area: [qrW, 'auto'],
                content: '<div id="qr-preview-box"></div><p style="word-break:break-all;padding:0 12px;font-size:12px;color:#666;">' + (d.qr_url || '') + '</p>'
            });
            setTimeout(function () { renderQr(d.qr_url, d.qr_image); }, 50);
            return;
        }
        if (obj.event === 'logs') {
            location.href = YMWL_ROOT_URL + '/admin/qrchannel/scanPage?channel_id=' + d.channel_id;
            return;
        }
        if (obj.event === 'off' || obj.event === 'on') {
            var st = obj.event === 'off' ? 0 : 1;
            layer.confirm('确认' + (st ? '启用' : '禁用') + '该渠道？', function (idx) {
                $.post(YMWL_ROOT_URL + '/admin/qrchannel/channelStatus', { id: d.channel_id, status: st }, function (res) {
                    layer.close(idx);
                    if (res.code === 0) { layer.msg('已保存'); reload(); }
                    else { layer.msg(res.msg || '失败', { icon: 2 }); }
                }, 'json');
            });
            return;
        }
        if (obj.event === 'del') {
            layer.confirm('删除后扫码将无法进入，确定？', function (idx) {
                $.post(YMWL_ROOT_URL + '/admin/qrchannel/channelDelete', { id: d.channel_id }, function (res) {
                    layer.close(idx);
                    if (res.code === 0) { layer.msg('已删除'); reload(); }
                    else { layer.msg(res.msg || '失败', { icon: 2 }); }
                }, 'json');
            });
            return;
        }
        if (obj.event === 'unlock') {
            layer.confirm('解锁后该链接可被新访客使用，确定？', function (idx) {
                $.post(YMWL_ROOT_URL + '/admin/qrchannel/channelUnlock', { id: d.channel_id }, function (res) {
                    layer.close(idx);
                    if (res.code === 0) { layer.msg('已解锁'); reload(); }
                    else { layer.msg(res.msg || '失败', { icon: 2 }); }
                }, 'json');
            });
            return;
        }
    });
});
</script>
{include file="public/footer"/}
