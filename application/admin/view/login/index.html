<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <meta content="telephone=no,email=no" name="format-detection" />
    <title>栗子集团 · 客服登录</title>
    <script>YMWL_ROOT_URL = '{$baseroot}';</script>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; min-height: 100%; }
        body {
            min-height: 100vh;
            font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Microsoft YaHei", Arial, sans-serif;
            color: #fff8f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 20px 60px;
            background:
                radial-gradient(circle at 15% 15%, rgba(201, 138, 81, .28), transparent 38%),
                radial-gradient(circle at 85% 85%, rgba(176, 137, 104, .26), transparent 38%),
                linear-gradient(135deg, #3e2723 0%, #5d4037 38%, #6f4e37 66%, #8d6e63 100%);
        }
        .kc-login-card {
            width: 100%;
            max-width: 380px;
            background: rgba(255, 248, 241, .98);
            border-radius: 22px;
            box-shadow: 0 30px 80px rgba(62, 39, 35, .45), 0 0 0 1px rgba(255, 248, 241, .12);
            padding: 36px 28px 28px;
            color: #3e2723;
            text-align: center;
        }
        .kc-login-mark {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            margin: 0 auto 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #c98a51 0%, #b08968 100%);
            color: #fff;
            font-size: 28px;
            font-weight: 800;
            box-shadow: 0 14px 28px rgba(201, 138, 81, .4);
        }
        .kc-login-brand {
            font-size: 20px;
            font-weight: 800;
            color: #3e2723;
            letter-spacing: .04em;
            margin: 0;
        }
        .kc-login-sub {
            margin: 4px 0 24px;
            font-size: 13px;
            color: #8d6e63;
            letter-spacing: .15em;
        }
        .kc-login-title {
            font-size: 14px;
            color: #6f4e37;
            margin: 0 0 18px;
            padding-bottom: 14px;
            border-bottom: 1px dashed rgba(141, 110, 99, .3);
            letter-spacing: .04em;
        }
        .kc-field {
            display: block;
            text-align: left;
            margin-bottom: 14px;
        }
        .kc-field span {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #6f4e37;
            margin-bottom: 6px;
            letter-spacing: .05em;
        }
        .kc-field input {
            width: 100%;
            height: 44px;
            padding: 0 14px;
            border: 1.5px solid #e2d5c5;
            border-radius: 12px;
            background: #fff;
            font-size: 14px;
            color: #3e2723;
            outline: none;
            transition: border .18s, box-shadow .18s;
        }
        .kc-field input:focus {
            border-color: #c98a51;
            box-shadow: 0 0 0 3px rgba(201, 138, 81, .18);
        }
        .kc-submit {
            width: 100%;
            height: 46px;
            margin-top: 6px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6f4e37 0%, #5d4037 50%, #3e2723 100%);
            color: #fff8f1;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: .08em;
            cursor: pointer;
            box-shadow: 0 12px 24px rgba(62, 39, 35, .35);
            transition: transform .12s, box-shadow .18s;
        }
        .kc-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 16px 32px rgba(62, 39, 35, .45);
        }
        .kc-submit:active { transform: translateY(0); }
        .kc-secondary {
            display: inline-block;
            margin-top: 14px;
            color: #8d6e63;
            font-size: 13px;
            text-decoration: none;
        }
        .kc-secondary:hover { color: #6f4e37; }
        .kc-copy {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 16px;
            margin: 0;
            padding: 0 12px;
            color: rgba(255, 248, 241, .6);
            font-size: 11px;
            text-align: center;
        }
        @media (max-width: 480px) {
            body { padding: 16px 14px 56px; }
            .kc-login-card { padding: 28px 20px 22px; border-radius: 18px; }
            .kc-login-mark { width: 56px; height: 56px; font-size: 24px; margin-bottom: 12px; }
            .kc-login-brand { font-size: 18px; }
            .kc-login-sub { margin-bottom: 18px; font-size: 12px; }
            .kc-login-title { margin-bottom: 14px; padding-bottom: 12px; }
            .kc-field { margin-bottom: 12px; }
            .kc-field input { height: 42px; font-size: 16px; }
            .kc-submit { height: 44px; font-size: 14px; }
        }
        @media (max-height: 580px) {
            .kc-login-card { padding: 22px 22px 18px; }
            .kc-login-mark { width: 52px; height: 52px; font-size: 22px; margin-bottom: 10px; }
            .kc-login-brand { font-size: 17px; }
            .kc-login-sub { margin-bottom: 16px; }
            .kc-login-title { margin-bottom: 14px; padding-bottom: 10px; }
            .kc-field { margin-bottom: 10px; }
            .kc-field input { height: 40px; }
            .kc-submit { height: 42px; }
        }
    </style>
</head>
<body>
    <div class="kc-login-card">
        <div class="kc-login-mark">栗</div>
        <p class="kc-login-brand">栗子集团</p>
        <p class="kc-login-sub">《客服专用》</p>
        <p class="kc-login-title">客服登录入口</p>
        <form method="post" action="{$submit}" class="js-modern-login-form" data-success-code="1">
            <label class="kc-field">
                <span>账号</span>
                <input type="text" name="username" autocomplete="username" placeholder="请输入客服账号">
            </label>
            <label class="kc-field">
                <span>密码</span>
                <input type="password" name="password" autocomplete="current-password" placeholder="请输入登录密码">
            </label>
            <input type="hidden" name="business_id" value="{$business_id|default=''}">
            <button id="login-submit" class="kc-submit" type="submit">登 录</button>
            {if $regist == 1}
            <a class="kc-secondary" href="{:url('admin/login/sign')}">没有账号？点击注册</a>
            {/if}
        </form>
    </div>
    <p class="kc-copy">
        {if condition="$business && (!empty($business['copyright']) || $business['copyright'] != '')"}{$business['copyright']}{else}© 栗子集团 · 客服系统{/if}
    </p>
    <script src="__libs__/jquery/jquery.min.js?v=__lkversion__"></script>
    <script src="/assets/login/js/login-modern.js?v=__lkversion__"></script>
</body>
</html>
