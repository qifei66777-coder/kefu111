<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
    <meta content="telephone=no,email=no" name="format-detection" />
    <title>在线客服系统注册-{$business['business_name']|default=""}</title>
    <script>
        YMWL_ROOT_URL = '{$baseroot}';
    </script>
    <!--加载引用文件 -->
    <link href="__libs__/layer/admin/admin.css?v=__lkversion__" rel="stylesheet">
    <link href="__libs__/layer/admin/login.css?v=__lkversion__" rel="stylesheet">
    <link href="__libs__/layer/admin/layui.css?v=__lkversion__" rel="stylesheet">
    <link href="__libs__/layer/skin/layer.css?v=__lkversion__" type="text/css" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            background:
                radial-gradient(circle at 15% 25%, rgba(201, 138, 81, .25), transparent 35%),
                radial-gradient(circle at 85% 80%, rgba(176, 137, 104, .25), transparent 38%),
                linear-gradient(135deg, #3e2723 0%, #5d4037 38%, #6f4e37 66%, #8d6e63 100%) !important;
            min-height: 100vh;
            font-family: "PingFang SC", -apple-system, "Microsoft YaHei", sans-serif;
        }
        .layadmin-user-login {
            background: transparent !important;
        }
        .kefu-mobile-brand {
            position: fixed; top: 0; left: 0; right: 0;
            height: 36px; padding: 0 14px;
            display: flex; align-items: center; justify-content: center;
            color: #fff8f1;
            background: linear-gradient(90deg, #3e2723 0%, #5d4037 50%, #6f4e37 100%);
            box-shadow: 0 2px 10px rgba(62, 39, 35, .35);
            z-index: 10000;
        }
        .kefu-mobile-brand .brand-mark {
            display: inline-flex; align-items: center; justify-content: center;
            width: 20px; height: 20px; border-radius: 6px;
            background: linear-gradient(135deg, #c98a51, #b08968);
            font-size: 11px; font-weight: 900; margin-right: 8px; color: #fff;
        }
        .kefu-mobile-brand .brand-name { font-size: 13px; font-weight: 700; letter-spacing: .04em; }
        .kefu-mobile-brand .brand-tag {
            margin-left: 8px; padding: 2px 7px; border-radius: 999px;
            background: rgba(255, 248, 241, .14);
            border: 1px solid rgba(255, 248, 241, .22);
            font-size: 10px; letter-spacing: .08em;
        }
        .layadmin-user-login-main {
            border-radius: 18px;
            box-shadow: 0 30px 80px rgba(62, 39, 35, .35);
        }
    </style>
</head>
<body>

<div class="kefu-mobile-brand">
    <span class="brand-mark">栗</span>
    <span class="brand-name">栗子集团</span>
    <span class="brand-tag">客服专用</span>
</div>

<div class="layadmin-user-login layadmin-user-display-show" id="LAY-user-login" style="display: none;">

    <div class="layadmin-user-login-main">
        <div class="layadmin-user-login-header">
            {if condition="$business && !empty($business['logo'])"}
            <img class="login-logo" src="{$business['logo']}">
            {/if}
            <h2>栗子集团 · 客服注册</h2>
        </div>
        <form method="post" action="{:url('regist')}" class="am-form" onsubmit="return false;">
            <div class="layadmin-user-login-body layui-form">
                <div class="layui-form-item">
                    <label class="layadmin-user-login-icon layui-icon layui-icon-service" for="business_name"></label>
                    <input type="text" name="business_name" lay-verify="required" placeholder="商家名称" class="layui-input" id="business_name">
                </div>
                <div class="layui-form-item">
                    <label class="layadmin-user-login-icon layui-icon layui-icon-username" for="LAY-user-login-username"></label>
                    <input type="text" name="user_name" id="LAY-user-login-username" lay-verify="required" placeholder="用户名" class="layui-input">
                </div>
                <div class="layui-form-item" id="login-input">
                    <label class="layadmin-user-login-icon layui-icon layui-icon-password" for="password"></label>
                    <input type="password" id="password" name="password" lay-verify="required" placeholder="密码" class="layui-input">
                </div>
                <div class="layui-form-item">
                    <label class="layadmin-user-login-icon layui-icon layui-icon-password" for="rpassword"></label>
                    <input type="password" id="repassword" name="repassword" lay-verify="required" placeholder="确认密码" class="layui-input">
                </div>
                <div class="layui-form-item">
                    <div class="layui-row">
                        <div class="layui-col-xs7">
                            <label class="layadmin-user-login-icon layui-icon layui-icon-vercode" for="LAY-user-login-vercode"></label>
                            <input type="text" name="captcha" lay-verify="required" placeholder="图形验证码" class="layui-input" id="LAY-user-login-vercode">
                        </div>

                        <div class="layui-col-xs5">
                            <div style="margin-left: 10px;">
                                <img  id="login-captcha" src="{:url('captcha')}?t={:mt_rand()}" class="layadmin-user-login-codeimg" align="absmiddle" onclick="this.src='{:url('captcha')}?_r='+Math.random();" title="不清楚? 点击换一个"/>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <button id="login-submit" class="layui-btn layui-btn-fluid" lay-submit lay-filter="loginForm">立即注册</button>
                </div>
            </div>

            <div class="layui-form-item">
                <a href="{:url('admin/login/index')}" style="font-size: 1.3em;color: #000;">已有账号？点击登录</a>
            </div>

        </form>
    </div>

    <div class="layui-trans layadmin-user-login-footer">

        <p>{if condition="$business && (!empty($business['copyright']) || $business['copyright'] != '')"}{$business['copyright']}{else} © 2021 来客PHP在线客服系统{/if}</p>
    </div>
</div>
<script type="text/javascript" src="__libs__/jquery/jquery.min.js?v=__lkversion__"></script>
<script src="__libs__/layui/layui.js?v=__lkversion__" type="text/javascript"></script>
<script type="text/javascript" src="__libs__/layer/layer.js?v=__lkversion__"></script>
<script>
    var domCaptcha=$('#login-captcha');
    //Demo
    layui.use(["form"], function () {

        var form = layui.form;

        //监听提交
        form.on('submit(loginForm)', function (data) {
            $.ajax({
                type: "post",
                url: data.form.action,
                data: data.field,
                dataType: 'json',
                success: function (res) {
                    if (res.code == 1) {
                        layer.open({
                            type:1,
                            title:'信息',
                            content:'<p style="padding: 1.8em;width: 180px;">注册成功</p>',
                            btn:['登录'],
                            yes:function(){
                                window.location.href="{:url('admin/login/index')}";
                            }
                        });
                    } else {
                        layui.layer.msg(res.msg);
                        domCaptcha.click();
                    }
                }
            });
            return false;
        });
    });
</script>

</body>
</html>
